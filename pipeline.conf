# ============================================================
# Precision Oncology Pipeline — System Configuration
# ============================================================
# Source this file or pass with --config to run_pipeline.sh.
# Machine-specific paths live here; per-sample params go on
# the CLI (or in a samples.tsv manifest for batch runs).
#
# Override any value by exporting it before calling the pipeline:
#   export NUM_GPUS=2
#   bash run_pipeline.sh ...
# ============================================================

# ------------------------------------------------------------
# Reference genome
# ------------------------------------------------------------
REF_DIR=/mnt/storage/parabricks_test/ref
REF_FASTA="${REF_DIR}/Homo_sapiens_assembly38.fasta"
KNOWN_SITES="${REF_DIR}/Homo_sapiens_assembly38.known_indels.vcf.gz"
GNOMAD_VCF="${REF_DIR}/af-only-gnomad.noalt.vcf.gz"
PON_VCF="${REF_DIR}/1000g_pon.noalt.vcf.gz"

# ------------------------------------------------------------
# Annotation tool paths
# ------------------------------------------------------------
PCGR_BUNDLE=/mnt/storage/pcgr_bundle
VEP_CACHE=/mnt/storage/vep_cache
OC_BIN=/mnt/storage/open-cravat-reports/oc-venv/bin/oc

# OncoKB API token (optional — enables live OncoKB annotation in DeepSomatic phase)
# Obtain at https://www.oncokb.org/account/register
ONCOKB_TOKEN=

# ------------------------------------------------------------
# GPU
# ------------------------------------------------------------
# Single-GPU mode (GPU 1 occupied by VLLM):
#   NUM_GPUS=1
#   GPU_DEVICE=0
#
# Dual-GPU mode (VLLM stopped on GPU 1):
#   NUM_GPUS=2
#   GPU_DEVICE=0,1
#
# Switch between modes by commenting/uncommenting the pair below,
# or override at runtime without editing this file:
#   bash run_pipeline.sh ... --num-gpus 2 --gpu-device 0,1
#
# Expected speedup from 2× RTX PRO 6000: ~1.5–1.8× for FQ2BAM,
# ~1.3× for DeepSomatic (memory-bandwidth bound at WGS depth).
# ------------------------------------------------------------
NUM_GPUS=1
GPU_DEVICE=0

# ------------------------------------------------------------
# Docker image versions (pinned)
# ------------------------------------------------------------
PARABRICKS_IMAGE=nvcr.io/nvidia/clara/clara-parabricks:4.7.0-1
PCGR_IMAGE=sigven/pcgr:2.2.5

# ------------------------------------------------------------
# Pipeline defaults (all overridable via CLI)
# ------------------------------------------------------------
# Base output directory — per-sample subdirs are created automatically
OUTDIR=/mnt/storage/parabricks_test/output

# DeepSomatic model type: WGS | WES | pacbio | ont
MODEL_TYPE=WGS

# Default OncoTree tumor type code (used for PCGR site mapping and VEP annotation)
TUMOR_TYPE=LUAD

# Estimated tumor purity (0.0–1.0) — passed to PCGR
TUMOR_PURITY=0.6

# Assay type for PCGR: WGS | WES | TARGETED
PCGR_ASSAY=WGS

# Concurrent VEP REST workers (DeepSomatic annotation phase)
WORKERS=5

# Open CRAVAT annotators to run (space-separated module names)
OC_ANNOTATORS="civic oncokb"
